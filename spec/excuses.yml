- id: 1
  text_en: "I’m sorry, I can’t come to work today. I have a headache."
  text_fr: "Désolé, je ne peux pas venir au travail aujourd’hui. J’ai mal à la tête."
  text_it: "Mi dispiace, oggi non posso venire a lavoro. Ho mal di testa."

